name: Release

# Push a tag like v0.1.0 to build installers and attach them to a draft GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.rel.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "ccmon $TAG" \
            --notes "Download the installer for your OS below. See the README for setup."
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: gui/ui/yarn.lock
      - name: Build installers (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          tauriScript: npx --yes @tauri-apps/cli@2
          releaseId: ${{ needs.create-release.outputs.id }}
      - name: Build and attach the terminal UI (ccmon)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo build --release -p cc-monitor
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/ccmon.exe ccmon-cli-windows-x64.exe; f=ccmon-cli-windows-x64.exe
          else
            cp target/release/ccmon ccmon-cli-linux-x64; f=ccmon-cli-linux-x64
          fi
          gh release upload "$TAG" "$f" --clobber
