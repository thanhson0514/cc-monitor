name: Release

# Builds installers and attaches them to a draft GitHub Release. Triggers:
# - push to main: if the version in Cargo.toml has no tag yet, tag HEAD as v<version>
#   and release it (bump the version in a PR, merge, done); otherwise nothing happens.
# - push a tag like v0.1.0 by hand, or run manually for an existing tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      release: ${{ steps.t.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: t
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
            tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "$tag already exists: nothing to release."
              echo "release=false" >> "$GITHUB_OUTPUT"
            else
              # A tag pushed with GITHUB_TOKEN does not re-trigger this workflow.
              git tag "$tag" "$GITHUB_SHA"
              git push origin "$tag"
              echo "Tagged $GITHUB_SHA as $tag."
              echo "release=true" >> "$GITHUB_OUTPUT"
            fi
          else
            tag="${{ github.event.inputs.tag || github.ref_name }}"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  create-release:
    needs: resolve
    if: needs.resolve.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    outputs:
      id: ${{ steps.rel.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "ccmon $TAG" \
            --notes "Download the installer for your OS below. See the README for setup."
          echo "id=$(gh release view "$TAG" --json databaseId -q .databaseId)" >> "$GITHUB_OUTPUT"

  desktop:
    needs: [resolve, create-release]
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: gui/ui/yarn.lock
      - name: Build installers (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui
          tauriScript: npx --yes @tauri-apps/cli@2
          releaseId: ${{ needs.create-release.outputs.id }}
      - name: Build and attach the terminal UI (ccmon)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo build --release -p cc-monitor
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/ccmon.exe ccmon-cli-windows-x64.exe; f=ccmon-cli-windows-x64.exe
          else
            cp target/release/ccmon ccmon-cli-linux-x64; f=ccmon-cli-linux-x64
          fi
          gh release upload "$TAG" "$f" --clobber
