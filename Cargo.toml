[workspace]
members = [".", "gui/src-tauri"]

[package]
name = "cc-monitor"
version = "0.3.2"
edition = "2021"
description = "Read-only TUI monitor for Claude Code sessions, subagents and workflows"
license = "MIT"

[[bin]]
name = "ccmon"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
dirs = "5"
unicode-width = "0.2"
sysinfo = { version = "0.30", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
