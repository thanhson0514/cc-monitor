[package]
name = "ccmon-gui"
version = "0.3.2"
edition = "2021"
description = "Desktop GUI for ccmon"

[[bin]]
name = "ccmon-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cc-monitor = { path = "../.." }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"

[dev-dependencies]
tempfile = "3"
